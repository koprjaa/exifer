name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # testy bezi pres `tape -r esm` a balicek esm na Node 22+ nefunguje
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm test
